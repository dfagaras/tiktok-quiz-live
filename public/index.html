<!doctype html>
<html lang="ro">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>TikTok Quiz Live</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main class="stage">
    <header><span id="category">QUIZ</span><span id="round"></span></header>
    <section class="question-card">
      <div class="eyebrow">ADEVĂRAT SAU FALS?</div>
      <h1 id="question">Se încarcă...</h1>
      <div class="timer"><div id="timerBar"></div></div>
      <div id="seconds" class="seconds">10</div>
    </section>

    <section class="answers">
      <button class="answer true" data-answer="A"><b>A</b><span>ADEVĂRAT</span><small id="aCount">0</small></button>
      <button class="answer false" data-answer="F"><b>F</b><span>FALS</span><small id="fCount">0</small></button>
    </section>

    <section id="result" class="result hidden"></section>

    <section class="leaderboard">
      <h2>🏆 CLASAMENT LIVE</h2>
      <ol id="leaders"></ol>
    </section>

    <section class="simulator">
      <strong>Simulator pentru dezvoltare</strong>
      <input id="username" value="Dragos" maxlength="30" aria-label="Nume spectator">
      <button data-sim="A">Trimite A</button>
      <button data-sim="F">Trimite F</button>
      <button id="crowd">Simulează 25 spectatori</button>
    </section>
  </main>
  <script src="/socket.io/socket.io.js"></script>
  <script src="/app.js"></script>
</body>
</html>
